[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npi-brain-sdk"
version = "0.1.7"
description = "Python SDK for the NPI brain perturbation visualizer."
readme = "SDK_README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "NPI Visualizer Contributors"}]
dependencies = [
    "Flask>=2.3,<4",
    "Flask-Cors>=4,<7",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "nibabel>=5.1,<6",
    "scikit-image>=0.21,<1",
    "pandas>=1.5,<3",
    "torch>=2.2,<3",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<1",
    "tigramite>=5.2,<6",
]

[project.optional-dependencies]
notebook = [
    "nilearn>=0.10,<1",
    "jupyter>=1.0,<2",
]
train = [
    "torch>=2.2,<3",
]

[project.scripts]
npi-demo = "npi_sdk.demo:main"

[tool.setuptools]
packages = ["npi_sdk", "npi_sdk._engine"]
py-modules = ["app", "NPI", "sitecustomize"]
include-package-data = true

[tool.setuptools.package-data]
"npi_sdk._engine" = [
    "templates/*.html",
    "data/*.npz",
    "data/*.json",
    "data/*.nii",
    "data/ec_results/*.npz",
    "data/ec_results/*.json",
    "data/causal_mask_results/*.npz",
    "data/causal_mask_results/*.json",
    "data/causal_mask_results/**/*.npz",
    "data/causal_mask_results/**/*.json",
    "data/npci_intervention_results/**/*.json",
    "external_algorithms/fask/*.jar",
    "external_algorithms/fask/*.java",
    "external_algorithms/fask/classes/*.class",
    "external_algorithms/fask/source/*.java",
    "NPCI/*.py",
    "NPCI/*.md",
    "NPCI/*.txt",
    "NPCI/results/grid_search/*.json",
    "NPCI/results/grid_search/*.csv",
    "real_fMRI_data/*.txt",
]

